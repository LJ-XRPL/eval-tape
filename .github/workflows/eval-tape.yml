name: Eval Tape

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "samples | run | seed"
        required: false
        default: "run"
        type: choice
        options:
          - samples
          - run
          - seed

permissions:
  contents: write

concurrency:
  group: eval-tape
  cancel-in-progress: false

jobs:
  eval-tape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cairo (SVG lab marks)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        if: github.event_name != 'schedule'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Render sample cards
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'samples'
        env:
          DRY_RUN: "true"
        run: |
          mkdir -p out
          python -m src.main --samples
          ls -la out/

      - name: Upload sample cards
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'samples'
        uses: actions/upload-artifact@v4
        with:
          name: eval-tape-cards
          path: out/
          if-no-files-found: error

      - name: Seed or run bot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'samples')
        env:
          DRY_RUN: "false"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FOUNDER_X_ACCESS_TOKEN: ${{ secrets.FOUNDER_X_ACCESS_TOKEN }}
          FOUNDER_X_ACCESS_SECRET: ${{ secrets.FOUNDER_X_ACCESS_SECRET }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}"
          if [ "$MODE" = "seed" ]; then
            python -m src.main --seed
          else
            python -m src.main --run
          fi

      - name: Commit state.json
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'samples')
        run: |
          git config user.name "eval-tape-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update eval tape state"
            git push
          fi
